<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="学术模式 Academic Mode：来源核查三遍，逻辑检查三遍，交付附核查记录">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082a52"/>
      <stop offset="0.55" stop-color="#0f4d92"/>
      <stop offset="1" stop-color="#2f6fc4"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.2" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#7fb2f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fb2f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- mortarboard -->
  <g transform="translate(96 150) scale(14)" fill="#ffffff" stroke="#ffffff" stroke-linejoin="round">
    <path d="M12 3.6 1.4 8.6 12 13.6l10.6-5z" stroke-width="0.4"/>
    <path d="M5.6 11.4v4.5c0 1.5 2.9 3.1 6.4 3.1s6.4-1.6 6.4-3.1v-4.5L12 14.5z" fill-opacity="0.82" stroke-width="0.4"/>
    <path d="M21.4 9.2v6" fill="none" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="21.4" cy="16.4" r="1.25" stroke="none"/>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC','Segoe UI',Arial,sans-serif" fill="#ffffff">
    <text x="470" y="236" font-size="132" font-weight="700" letter-spacing="6">学术模式</text>
    <text x="474" y="300" font-size="44" font-weight="400" letter-spacing="9" fill="#cfe0f7">ACADEMIC MODE</text>

    <text x="474" y="380" font-size="36" font-weight="400" fill="#ffffff">让 AI 助手像审稿人一样工作</text>

    <!-- three promises -->
    <g font-size="30" font-weight="600">
      <rect x="474" y="424" width="236" height="64" rx="32" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.45"/>
      <text x="592" y="466" text-anchor="middle">来源核查 ×3</text>
      <rect x="726" y="424" width="236" height="64" rx="32" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.45"/>
      <text x="844" y="466" text-anchor="middle">逻辑检查 ×3</text>
      <rect x="978" y="424" width="236" height="64" rx="32" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.45"/>
      <text x="1096" y="466" text-anchor="middle">附核查记录</text>
    </g>

    <text x="474" y="576" font-size="26" fill="#cfe0f7" letter-spacing="1.5">Claude Code  ·  Codex  ·  Antigravity  ·  DeepSeek Harness</text>
  </g>
</svg>
